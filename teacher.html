<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WordQuest Teacher</title><style>body{font-family:Inter,system-ui,sans-serif;background:#f6f7fb;color:#202431;margin:0}.app{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7ef;border-radius:18px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f8f8fc;border-radius:12px;padding:12px}.stat b{font-size:22px;display:block}.row{display:flex;gap:10px;flex-wrap:wrap}.input,.btn{padding:11px 12px;border-radius:10px;border:1px solid #dfe2ea;font-size:15px}.btn{background:#5b5bd6;color:#fff;border:0;font-weight:800;cursor:pointer}.btn.alt{background:#eef0f8;color:#303545}.student{display:grid;grid-template-columns:1.5fr repeat(6,.7fr) 1.2fr;gap:8px;padding:11px 4px;border-bottom:1px solid #eceef3;align-items:center;font-size:13px}.student.head{font-weight:800;color:#6d7380}.tag{display:inline-block;padding:4px 7px;border-radius:99px;background:#eef0f5;font-size:11px}.high{background:#ffe8ea;color:#982230}.medium{background:#fff4d8;color:#795700}.ok{background:#eaf8ef;color:#17673a}.hidden{display:none}.word{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:8px 0}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.student{grid-template-columns:1fr 1fr}.student.head{display:none}}</style></head><body><div class="app"><h1>WordQuest Teacher</h1><div id="auth" class="card"><div class="row"><input id="name" class="input" placeholder="Teacher name"><input id="username" class="input" placeholder="Username"><input id="code" class="input" placeholder="6-digit code" maxlength="6" type="password"><button class="btn" id="login">Sign in</button><button class="btn alt" id="register">Create teacher account</button></div></div><div id="main" class="hidden"><div class="card"><h2>Classes</h2><div class="row"><input id="className" class="input" placeholder="Class name"><select id="year" class="input"><option>Y3</option><option selected>Y4</option><option>Y5</option><option>Y6</option></select><button id="createClass" class="btn">Create class</button><select id="classSelect" class="input"></select><button id="refresh" class="btn alt">Refresh</button></div><div class="row" style="margin-top:10px"><input id="studentUsername" class="input" placeholder="Student username"><button id="addStudent" class="btn alt">Add student to class</button></div></div><div id="summary" class="grid"></div><div class="card"><h2>Class overview</h2><div class="student head"><div>Student</div><div>7d</div><div>30d Qs</div><div>Gem</div><div>Mastered</div><div>Secure</div><div>Fragile</div><div>Teacher action</div></div><div id="roster"></div></div><div id="detail" class="card hidden"></div></div></div><script>let token=localStorage.wq_teacher_token||'',classes=[];const $=x=>document.getElementById(x);async function api(url,opt={}){opt.headers={...(opt.headers||{}),'content-type':'application/json',...(token?{Authorization:`Bearer ${token}`}:{})};const r=await fetch(url,opt);const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j}async function auth(action){try{const d=await api('/api/teacher/auth',{method:'POST',body:JSON.stringify({action,name:$('name').value.trim(),username:$('username').value.trim(),code:$('code').value.trim()})});token=d.token;localStorage.wq_teacher_token=token;$('auth').classList.add('hidden');$('main').classList.remove('hidden');await loadClasses()}catch(e){alert(e.message)}}$('login').onclick=()=>auth('login');$('register').onclick=()=>auth('register');async function loadClasses(){const d=await api('/api/teacher/classes');classes=d.classes||[];$('classSelect').innerHTML=classes.map(c=>`<option value="${c.id}">${esc(c.name)} · ${c.year_group} · ${c.student_count} pupils</option>`).join('');if(classes.length)await loadDashboard()}$('createClass').onclick=async()=>{await api('/api/teacher/classes',{method:'POST',body:JSON.stringify({action:'create',name:$('className').value,year_group:$('year').value})});await loadClasses()};$('addStudent').onclick=async()=>{const class_id=Number($('classSelect').value);await api('/api/teacher/classes',{method:'POST',body:JSON.stringify({action:'add_student',class_id,username:$('studentUsername').value.trim()})});$('studentUsername').value='';await loadDashboard()};$('refresh').onclick=loadDashboard;$('classSelect').onchange=loadDashboard;async function loadDashboard(){const id=Number($('classSelect').value);if(!id)return;const d=await api(`/api/teacher/dashboard?class_id=${id}`);const s=d.summary;$('summary').innerHTML=[['Students',s.student_count],['Active this week',s.active_7d],['Need attention',s.needs_attention],['Questions / 30d',s.total_questions_30d]].map(x=>`<div class="stat"><b>${x[1]}</b>${x[0]}</div>`).join('');$('roster').innerHTML=d.students.map(x=>`<div class="student"><div><b>${esc(x.name)}</b><br><small>${esc(x.username||'')}</small></div><div>${x.sessions_7d}</div><div>${x.questions_30d}</div><div>${Math.round(x.target_gem)}</div><div>${x.mastered_words}</div><div>${x.secure_words}</div><div>${x.fragile_words}</div><div><span class="tag ${x.attention.level}">${esc(x.attention.reason)}</span> <button class="btn alt" onclick="detail(${x.id})">View</button></div></div>`).join('')}async function detail(studentId){const id=Number($('classSelect').value);const d=await api(`/api/teacher/dashboard?class_id=${id}&student_id=${studentId}`);$('detail').classList.remove('hidden');$('detail').innerHTML=`<h2>${esc(d.student.name)}</h2><p>Gem target <b>${Math.round(d.profile.target_gem||55)}</b> · Mastered <b>${d.status_counts.mastered||0}</b> · Secure <b>${d.status_counts.secure||0}</b> · Fragile <b>${d.status_counts.fragile||0}</b></p><h3>Words needing work</h3>${d.needs_work.slice(0,20).map(w=>`<div class="word"><span><b>${esc(w.lemma)}</b> · ${w.status}</span><span>overall ${pct(w.mastery)} · context ${pct(w.context)} · production ${pct(w.production)}</span></div>`).join('')||'<p>None yet.</p>'}<h3>Proficient words</h3>${d.proficient_words.slice(0,30).map(w=>`<div class="word"><span><b>${esc(w.lemma)}</b> · ${w.status}</span><span>${pct(w.mastery)}</span></div>`).join('')||'<p>No secure words yet.</p>'}`;$('detail').scrollIntoView({behavior:'smooth'})}function pct(x){return Math.round(Number(x||0)*100)+'%'}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}if(token){$('auth').classList.add('hidden');$('main').classList.remove('hidden');loadClasses().catch(()=>{localStorage.removeItem('wq_teacher_token');location.reload()})}</script></body></html>
