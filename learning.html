<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WordQuest Learning Engine v1</title><style>body{font-family:Inter,system-ui,sans-serif;background:#f6f7fb;color:#202431;margin:0}.app{max-width:720px;margin:auto;padding:20px}.card{background:white;border:1px solid #e5e7ef;border-radius:20px;padding:22px}.input,.btn{width:100%;padding:13px;border-radius:12px;border:1px solid #dfe2ea;font-size:16px;margin:7px 0}.btn{border:0;background:#5b5bd6;color:white;font-weight:850;cursor:pointer}.btn.alt{background:#eef0f8;color:#303545}.option{display:block;width:100%;text-align:left;padding:13px;margin:9px 0;border-radius:12px;border:1px solid #dfe2ea;background:#fff;font-size:15px;cursor:pointer}.option.selected{border:2px solid #5b5bd6;background:#f1f1ff}.tag{display:inline-block;background:#f0f0fa;color:#4545a5;border-radius:99px;padding:5px 8px;font-size:11px;font-weight:800}.muted{color:#6d7380}.feedback{padding:12px;border-radius:12px;background:#eefaf3;margin:12px 0}.bad{background:#fff0f2}.hidden{display:none}.bar{height:8px;background:#e7e9ef;border-radius:99px;overflow:hidden;margin:15px 0}.bar i{display:block;height:100%;background:#5b5bd6}</style></head><body><div class="app"><h1>WordQuest</h1><p class="muted">Learning Engine v1 pilot · deep vocabulary mastery</p><div id="login" class="card"><input id="username" class="input" placeholder="Student username"><input id="code" class="input" placeholder="6-digit code" maxlength="6" type="password"><button id="signIn" class="btn">Sign in</button></div><div id="practice" class="card hidden"><div id="meta"></div><div class="bar"><i id="bar" style="width:0%"></i></div><div id="q"></div></div></div><script>const $=x=>document.getElementById(x);let token='',student=null,ps=null,i=0,n=10,correct=0,hints=0,current=null,start=0,targetGem=55;async function api(url,opt={}){opt.headers={...(opt.headers||{}),'content-type':'application/json',...(token?{Authorization:`Bearer ${token}`}:{})};const r=await fetch(url,opt);let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error||j.detail||`HTTP ${r.status}`);return j}$('signIn').onclick=async()=>{try{const d=await api('/api/auth',{method:'POST',body:JSON.stringify({action:'login',username:$('username').value.trim(),code:$('code').value.trim()})});token=d.token;student=d.student;$('login').classList.add('hidden');$('practice').classList.remove('hidden');const p=await api('/api/practice',{method:'POST',body:JSON.stringify({year_group:student.current_year_group})});ps=p.practice_session_id;targetGem=p.target_gem||55;next()}catch(e){alert(e.message)}};async function next(){if(i>=n)return finish();$('q').innerHTML='<p>Choosing the next best learning task…</p>';const d=await api(`/api/learning/next?year=${encodeURIComponent(student.current_year_group)}`);current=d.question;targetGem=d.target_gem||targetGem;start=Date.now();render()}function render(){$('meta').innerHTML=`<span class="tag">${esc(student.current_year_group)}</span> <span class="tag">Gem ${Math.round(targetGem)}</span> <span class="tag">${esc(current.dimension)}</span> <span class="tag">${i+1}/${n}</span>`;$('bar').style.width=`${100*i/n}%`;if(current.response_mode==='free_text'){$('q').innerHTML=`<h2>${esc(current.prompt)}</h2><textarea id="answer" class="input" rows="4" placeholder="Write your sentence here"></textarea><button class="btn" onclick="submitText()">Submit</button>`}else{$('q').innerHTML=`<h2 style="white-space:pre-line">${esc(current.prompt)}</h2><div>${current.options.map((x,j)=>`<button class="option" data-i="${j}">${esc(x)}</button>`).join('')}</div><button id="submit" class="btn" disabled>Submit</button>`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');b.dataset.chosen='1';$('submit').disabled=false});$('submit').onclick=submitMcq}}async function submitMcq(){const b=[...document.querySelectorAll('.option')].find(x=>x.dataset.chosen==='1');if(!b)return;const chosen=current.options[Number(b.dataset.i)],ok=chosen===current.correct_answer;if(ok)correct++;const d=await api('/api/attempts',{method:'POST',body:JSON.stringify({practice_session_id:ps,word_id:current.word_id,year_group:student.current_year_group,question_type:current.type,correct:ok,hints_used:0,response_ms:Date.now()-start,gem_score:current.gem_score})});targetGem=d.learning_engine_v1?.target_gem||targetGem;feedback(ok?`Correct — good ${current.dimension} evidence.`:`Not quite. The best answer was: ${current.correct_answer}`,ok)}async function submitText(){const sentence=$('answer').value.trim();if(sentence.length<6)return alert('Write a complete sentence.');try{const d=await api('/api/learning/production',{method:'POST',body:JSON.stringify({practice_session_id:ps,word_id:current.word_id,year_group:student.current_year_group,sentence,response_ms:Date.now()-start,gem_score:current.gem_score})});if(d.passed)correct++;targetGem=d.learning_engine_v1?.target_gem||targetGem;feedback(`${Math.round(d.score*100)}% — ${d.feedback}`,d.passed)}catch(e){alert(e.message)}}function feedback(text,ok){$('q').innerHTML=`<div class="feedback ${ok?'':'bad'}"><b>${ok?'Evidence strengthened':'Still learning'}</b><p>${esc(text)}</p></div><button class="btn" id="continue">Continue</button>`;$('continue').onclick=()=>{i++;next()}}async function finish(){await api('/api/practice',{method:'PATCH',body:JSON.stringify({practice_session_id:ps,question_count:n,correct_count:correct,hints_used:hints,gems_earned:0,end_target_gem:targetGem})}).catch(()=>{});$('bar').style.width='100%';$('q').innerHTML=`<h2>Session complete</h2><p><b>${correct}/${n}</b> tasks passed.</p><p>Your next Gem target is <b>${Math.round(targetGem)}</b>. WordQuest will bring fragile and overdue words back automatically.</p><button class="btn" onclick="location.reload()">Done</button>`}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
